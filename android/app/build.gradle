plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.qhf.hanmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.qhf.hanmobile'
        minSdk        24
        targetSdk     35

        // CI 실행 번호를 그대로 버전으로 쓴다. 로컬 빌드면 1 / 1.0.0.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // 서명 정보는 전부 환경변수로 받는다 — 저장소에 keystore 를 넣지 않는다.
    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile     file(storePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias      System.getenv('ANDROID_KEY_ALIAS')
                keyPassword   System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Kotlin 1.8 부터 kotlin-stdlib-jdk7/jdk8 의 내용은 kotlin-stdlib 본체로 들어갔다.
    // 전이 의존성이 옛 1.6.21 을 함께 끌고 오면 같은 클래스가 두 벌 생겨
    // :app:checkReleaseDuplicateClasses 에서 빌드가 깨진다.
    // BOM 으로 kotlin 아티팩트 버전을 맞추면 jdk7/jdk8 은 빈 스텁이 되어 충돌이 사라진다.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.1'
}
